[tools]
"cargo:cargo-nextest" = "latest"

[tasks.build]
description = "Debug build"
run = "cargo build"

[tasks.release]
description = "Release build"
run = "cargo build --release"

[tasks.check]
description = "Type-check without building"
run = "cargo check"

[tasks.test]
description = "Run the test suite (all_modes_smoke is slow unoptimized)"
run = "cargo nextest run --release"

[tasks.lint]
description = "Clippy, no writes"
run = "cargo clippy -- -D warnings"

[tasks.format]
description = "Format the codebase"
run = "cargo fmt"

[tasks.gen-glyphs]
description = "Generate the indicator glyph table"
run = "cargo run --release --manifest-path scripts/gen-glyphs/Cargo.toml"

[tasks.clean]
description = "Remove build output"
run = "cargo clean"

[tasks.man]
description = "Build the man page"
run = "mkdir -p target && scdoc < docs/baijia-suo.1.scd > target/baijia-suo.1"

# Visual QA — thin named wrappers around the qa harness
# (.config/mise/tasks/qa.sh), which explains the nested-niri setup these all
# share. Build first (`mise run release`); extra args are appended, e.g.
# `mise run qa-indicator ripple`.

[tasks.qa-playlist]
description = "Visual QA: multi-mode playlist handoff (.config/mise/qa/playlist.toml)"
run = "mise run qa -- -s -- -C .config/mise/qa/playlist.toml"

[tasks.qa-capped]
description = "Visual QA: max_fps caps rendering, not speed (.config/mise/qa/capped.toml)"
run = "mise run qa -- -s -- -C .config/mise/qa/capped.toml"

[tasks.qa-timing]
description = "Visual QA: per-frame advance vs present cost (--debug-timing is args-only, no config key)"
run = "mise run qa -- -s -- --debug-timing -A petri"

[tasks.qa-indicator]
description = "Visual QA: type at one indicator style, e.g. `mise run qa-indicator ripple`"
run = "mise run qa -- -s -- --indicator-mode"
