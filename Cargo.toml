[package]
name = "baijia-suo"
version = "0.1.0"
edition = "2021"
authors = []
description = "A secure Wayland screen locker with xlockmore animation support"
license = "MIT AND OFL-1.1"
rust-version = "1.89"

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# Disable Wayland defaults; keyboard input uses a self-mapped fd and new_from_string.
xkbcommon = { version = "0.9", default-features = false }
# Pure-Rust 2D rasterizer: no libcairo, glib, freetype, or fontconfig runtime deps.
# Glyph outlines are pre-extracted by scripts/gen-glyphs.
# Disable PNG defaults; the indicator only needs standard-library SIMD rasterization.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
libc = "0.2" # fork, pipe, mlock, prctl, setres*, …
zeroize = "1.8"
log = "0.4"

# basic-toml is parse-only; serde derives deserialize the configuration schema.
basic-toml = "0.1"
serde = { version = "1", features = ["derive"] }
[dev-dependencies]
criterion = "0.8.2"
tempfile = "3"

[[bench]]
name = "animations"
harness = false

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true
