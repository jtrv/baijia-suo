name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    # A wedged apt mirror once ate the full 6h default; fail fast instead.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Link deps: libwayland-client, libxkbcommon, libpam.
      # azure.archive.ubuntu.com stalls apt indefinitely on some runners
      # (hung a run for 6h); pin the canonical mirror instead.
      - run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|' /etc/apt/apt-mirrors.txt
          sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libpam0g-dev
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run --release
