name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Link deps: libwayland-client, libxkbcommon, libpam. scdoc for the man page.
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libpam0g-dev scdoc
      - run: cargo build --release --locked
      - run: scdoc <docs/baijia-suo.1.scd >baijia-suo.1
      - name: Package
        run: |
          ver="${GITHUB_REF_NAME#v}"
          dir="baijia-suo-${ver}-x86_64-linux"
          mkdir "$dir"
          cp target/release/baijia-suo baijia-suo.1 LICENSE README.md docs/config.example.toml "$dir"/
          # Binary embeds Liberation Sans; OFL-1.1 requires its license ship too.
          cp fonts/LICENSE "$dir"/LICENSE.font
          cp -r target/completions "$dir"/
          tar czf "${dir}.tar.gz" "$dir"
          sha256sum "${dir}.tar.gz" > "${dir}.tar.gz.sha256"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # ponytail: re-running on an existing tag would otherwise fail with
        # "release already exists" — replace it instead of erroring.
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" --generate-notes baijia-suo-*.tar.gz baijia-suo-*.tar.gz.sha256
