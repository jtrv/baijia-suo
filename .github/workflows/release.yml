name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install stable --profile minimal
      # Link deps: libwayland-client, libxkbcommon, libpam. scdoc for the man page.
      # azure.archive.ubuntu.com stalls apt indefinitely on some runners; see ci.yml.
      - run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|' /etc/apt/apt-mirrors.txt
          sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libpam0g-dev scdoc
      - run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets --release --locked
          cargo build --release --locked
      - run: scdoc <docs/baijia-suo.1.scd >baijia-suo.1
      - name: Package
        run: |
          ver="${GITHUB_REF_NAME#v}"
          dir="baijia-suo-${ver}-x86_64-linux"
          mkdir "$dir"
          cp target/release/baijia-suo baijia-suo.1 LICENSE README.md docs/config.example.toml "$dir"/
          # Binary embeds Liberation Sans; OFL-1.1 requires its license ship too.
          cp fonts/LICENSE "$dir"/LICENSE.font
          cp -r target/completions "$dir"/
          tar czf "${dir}.tar.gz" "$dir"
          sha256sum "${dir}.tar.gz" > "${dir}.tar.gz.sha256"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --generate-notes only accepts extra prose via --notes, not
          # --notes-file; passing both silently drops the provenance section.
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            --notes "$(cat .github/release-notes.md)" \
            baijia-suo-*.tar.gz baijia-suo-*.tar.gz.sha256
      - name: Attest release archive
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.0
        with:
          subject-path: baijia-suo-*.tar.gz
